<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIZORA Universal App Builder</title><style>*{box-sizing:border-box}body{margin:0;background:#0e1728;color:#edf3ff;font:15px system-ui}header{padding:22px;background:linear-gradient(120deg,#203a70,#102037)}main{max-width:850px;margin:auto;padding:16px}.card{background:#1b2a42;border:1px solid #334862;border-radius:16px;padding:18px;margin:14px 0}input,textarea,button{font:inherit;border-radius:9px;padding:11px;border:1px solid #465c78}input,textarea{width:100%;background:#0c182b;color:white;margin:7px 0}textarea{height:250px;font-family:monospace}button{background:#3d7cff;color:white;cursor:pointer;margin:4px 3px 4px 0}button.alt{background:#334761}button.danger{background:#813e48}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.item{border:1px solid #3d526e;border-radius:10px;padding:10px;margin:8px 0}.muted{color:#b7c8dc;font-size:13px}.hidden{display:none}h1{margin:0 0 6px;font-size:25px}h2{margin-top:0}</style></head><body><header><h1>🚀 AIZORA Universal App Builder</h1><div>My Projects · File Manager · HTML Editor · ZIP Export</div></header><main><section class="card"><h2>নতুন প্রজেক্ট</h2><input id="projectName" placeholder="প্রজেক্টের নাম"><button id="addProject">＋ Create Project</button></section><section class="card"><h2>📁 My Projects</h2><div id="projects"></div><div id="manager" class="hidden"><hr><h2 id="currentTitle"></h2><div class="row"><button id="newFile">＋ New File</button><button id="newFolder" class="alt">＋ New Folder</button><button id="exportZip">📦 Export ZIP</button><button id="back" class="alt">← Back</button></div><div id="path" class="muted"></div><div id="items"></div><div id="editor" class="hidden"><h3 id="editTitle"></h3><textarea id="content" spellcheck="false"></textarea><button id="save">💾 Save File</button><button id="close" class="alt">Close</button></div></div></section><section class="card muted">এই সংস্করণে প্রজেক্ট ও ফাইল ব্রাউজারের LocalStorage-এ সংরক্ষিত হয়। এটি APK Builder নয়; Android APK তৈরির সুবিধা এখনো যুক্ত হয়নি।</section></main><script>(()=>{'use strict';const KEY='aizora_universal_builder_projects_v1',$=id=>document.getElementById(id);let data=[],active=null,folder='',editing=null;try{const raw=JSON.parse(localStorage.getItem(KEY)||'[]');data=Array.isArray(raw)?raw:[]}catch{}const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){alert('সেভ হয়নি: '+e.message);return false}},cur=()=>data.find(p=>p.id===active),uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),safe=s=>s&&!/[\\/\x00-\x1f]/.test(s)&&s!=='.'&&s!=='..',base=s=>s.split('/').pop(),parent=s=>s.split('/').slice(0,-1).join('/'),path=s=>folder?folder+'/'+s:s;function render(){const box=$('projects');box.replaceChildren();data.forEach(p=>{let div=document.createElement('div');div.className='item';let b=document.createElement('button');b.textContent='📂 '+p.name;b.onclick=()=>{active=p.id;folder='';editing=null;$('manager').classList.remove('hidden');renderFiles()};div.append(b);const tree=document.createElement('div');tree.className='muted';tree.style.padding='8px 12px';tree.textContent='📁 '+p.name+' /  📄 index.html  ·  📄 style.css  ·  📄 script.js';const folders=Array.isArray(p.folders)?p.folders:[];const files=Array.isArray(p.files)?p.files:[];if(folders.length||files.length){tree.textContent='📁 '+p.name+' / '+[...folders.map(f=>'📁 '+f),...files.map(f=>'📄 '+f.path)].slice(0,5).join('  ·  ')+(folders.length+files.length>5?' …':'')}else tree.textContent='📁 '+p.name+' / (ফাইল নেই — প্রজেক্ট খুলে তৈরি করুন)';div.append(tree);box.append(div)});if(!data.length)box.textContent='এখনো কোনো প্রজেক্ট নেই।'}function renderFiles(){let p=cur();if(!p)return;p.files=Array.isArray(p.files)?p.files:[];p.folders=Array.isArray(p.folders)?p.folders:[];$('currentTitle').textContent=p.name;$('path').textContent='Path: /'+folder;$('items').replaceChildren();if(folder){const b=document.createElement('button');b.className='alt';b.textContent='⬆ Parent Folder';b.onclick=()=>{folder=parent(folder);renderFiles()};$('items').append(b)}const entries=[...p.folders.filter(s=>parent(s)===folder).map(s=>({kind:'folder',name:base(s),full:s})),...p.files.filter(f=>parent(f.path)===folder).map(f=>({kind:'file',name:base(f.path),full:f.path,obj:f}))];entries.forEach(e=>{const d=document.createElement('div');d.className='item';const b=document.createElement('button');b.className='alt';b.textContent=(e.kind==='folder'?'📁 ':'📄 ')+e.name;b.onclick=()=>{if(e.kind==='folder'){folder=e.full;$('editor').classList.add('hidden');renderFiles()}else{editing=e.obj.id;$('editTitle').textContent=e.full;$('content').value=e.obj.content||'';$('editor').classList.remove('hidden')}};d.append(b);const del=document.createElement('button');del.className='danger';del.textContent='Delete';del.onclick=()=>{if(!confirm('মুছে ফেলবেন?'))return;if(e.kind==='folder'){if(p.folders.some(s=>s.startsWith(e.full+'/'))||p.files.some(f=>f.path.startsWith(e.full+'/'))){alert('ফোল্ডার খালি করুন');return}p.folders=p.folders.filter(s=>s!==e.full)}else p.files=p.files.filter(f=>f.id!==e.obj.id);if(persist())renderFiles()};d.append(del);$('items').append(d)});if(!entries.length){let d=document.createElement('p');d.className='muted';d.textContent='এই ফোল্ডার খালি।';$('items').append(d)}}$('addProject').onclick=()=>{const name=$('projectName').value.trim();if(!safe(name))return alert('সঠিক নাম দিন');data.push({id:uid(),name,type:'Web App',files:[{id:uid(),path:'index.html',content:'<!doctype html>\n<html lang="bn">\n<head><meta charset="utf-8"><title>'+name.replace(/[<>&"']/g,'')+'</title><link rel="stylesheet" href="style.css"></head>\n<body><h1>Welcome to '+name.replace(/[<>&"']/g,'')+'</h1><script src="script.js"><\/script></body>\n</html>',updatedAt:new Date().toISOString()},{id:uid(),path:'style.css',content:'body { font-family: sans-serif; margin: 24px; }',updatedAt:new Date().toISOString()},{id:uid(),path:'script.js',content:'console.log("AIZORA project ready");',updatedAt:new Date().toISOString()}],folders:['assets']});if(persist()){$('projectName').value='';render()}};$('newFolder').onclick=()=>{const p=cur(),name=prompt('ফোল্ডারের নাম');if(name===null)return;if(!safe(name.trim()))return alert('সঠিক নাম দিন');const full=path(name.trim());if(p.folders.includes(full)||p.files.some(f=>f.path===full))return alert('এই নাম আছে');p.folders.push(full);if(persist())renderFiles()};$('newFile').onclick=()=>{const p=cur(),name=prompt('ফাইলের নাম (যেমন index.html)');if(name===null)return;if(!safe(name.trim()))return alert('সঠিক নাম দিন');const full=path(name.trim());if(p.folders.includes(full)||p.files.some(f=>f.path===full))return alert('এই নাম আছে');const f={id:uid(),path:full,content:'',updatedAt:new Date().toISOString()};p.files.push(f);if(persist()){renderFiles();editing=f.id;$('editTitle').textContent=full;$('content').value='';$('editor').classList.remove('hidden')}};$('save').onclick=()=>{const f=cur().files.find(f=>f.id===editing);if(!f)return;const old=f.content;f.content=$('content').value;f.updatedAt=new Date().toISOString();if(!persist())f.content=old;else alert('সেভ হয়েছে')};$('close').onclick=()=>$('editor').classList.add('hidden');$('back').onclick=()=>{$('manager').classList.add('hidden');$('editor').classList.add('hidden');active=null};function crc32(a){let c=-1;for(const b of a){c^=b;for(let i=0;i<8;i++)c=(c>>>1)^((c&1)?0xedb88320:0)}return(c^-1)>>>0}function zip(entries){const enc=new TextEncoder(),parts=[],central=[];let offset=0;const u16=(v,n,x)=>v.setUint16(n,x,true),u32=(v,n,x)=>v.setUint32(n,x>>>0,true);for(const [name,content,dir] of entries){const n=enc.encode(name),bytes=dir?new Uint8Array():enc.encode(content||''),crc=crc32(bytes),h=new Uint8Array(30+n.length),v=new DataView(h.buffer);u32(v,0,0x04034b50);u16(v,4,20);u16(v,6,0x800);u32(v,14,crc);u32(v,18,bytes.length);u32(v,22,bytes.length);u16(v,26,n.length);h.set(n,30);parts.push(h,bytes);const c=new Uint8Array(46+n.length),w=new DataView(c.buffer);u32(w,0,0x02014b50);u16(w,4,20);u16(w,6,20);u16(w,8,0x800);u32(w,16,crc);u32(w,20,bytes.length);u32(w,24,bytes.length);u16(w,28,n.length);u32(w,38,dir?0x00100000:0);u32(w,42,offset);c.set(n,46);central.push(c);offset+=h.length+bytes.length}const end=new Uint8Array(22),v=new DataView(end.buffer),size=central.reduce((a,b)=>a+b.length,0);u32(v,0,0x06054b50);u16(v,8,entries.length);u16(v,10,entries.length);u32(v,12,size);u32(v,16,offset);return new Blob([...parts,...central,end],{type:'application/zip'})}$('exportZip').onclick=()=>{const p=cur();if(!p)return;const root=p.name.replace(/[\\/:*?"<>|\x00-\x1f]/g,'_')||'AIZORA-Project',entries=[[root+'/', '',true]];p.folders.forEach(f=>entries.push([root+'/'+f+'/', '',true]));p.files.forEach(f=>entries.push([root+'/'+f.path,f.content||'',false]));if(entries.length===1)entries.push([root+'/README.txt','No files created yet.',false]);const url=URL.createObjectURL(zip(entries)),a=document.createElement('a');a.href=url;a.download=root+'.zip';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)};render()})();</script></body></html>
