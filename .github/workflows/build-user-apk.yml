name: Build User Android Project APK

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Build ID returned by AIZORA Builder API
        required: true
        type: string
      project_name:
        description: Project name
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Compile uploaded Android project
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download source ZIP from protected AIZORA API
        env:
          API_BASE_URL: ${{ secrets.AIZORA_BUILD_API_URL }}
          BUILD_DOWNLOAD_TOKEN: ${{ secrets.AIZORA_BUILD_DOWNLOAD_TOKEN }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          set -euo pipefail
          test -n "$API_BASE_URL"
          test -n "$BUILD_DOWNLOAD_TOKEN"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $BUILD_DOWNLOAD_TOKEN" \
            "$API_BASE_URL/api/build-source?build_id=$BUILD_ID" \
            -o project-source.zip
          test -s project-source.zip
          mkdir -p project
          unzip -q project-source.zip -d project

      - name: Locate Android Gradle project
        id: locate
        run: |
          set -euo pipefail
          SETTINGS="$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo "No settings.gradle/settings.gradle.kts found. Upload a complete Android Gradle project." >&2
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project: $PROJECT_DIR"

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          elif [ -f ./build.gradle ] || [ -f ./build.gradle.kts ]; then
            echo "Project has no Gradle wrapper; installing Gradle 8.9."
            curl --fail --silent --show-error -L https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
            /tmp/gradle-8.9/bin/gradle --no-daemon assembleDebug
          else
            echo "No Gradle build file found in project root." >&2
            exit 1
          fi

      - name: Collect APK outputs
        if: success()
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail
          mkdir -p apk-output
          find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/*/*.apk' -exec cp {} apk-output/ \;
          test -n "$(find apk-output -type f -name '*.apk' -print -quit)"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AIZORA-Project-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 14
