name: Build Generated Flutter Project Web

on:
  workflow_dispatch:
    inputs:
      project_dir:
        description: "Repository folder containing pubspec.yaml and lib/main.dart"
        required: true
        default: "projects/flutter-source-demo/flutter"
        type: string
  push:
    branches: [main]
    paths:
      - "projects/**/flutter/**"
      - ".github/workflows/build-flutter-web.yml"

permissions:
  contents: read

jobs:
  build-flutter-web:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout generated project source
        uses: actions/checkout@v4

      - name: Validate Flutter source folder
        env:
          PROJECT_DIR: ${{ inputs.project_dir || 'projects/flutter-source-demo/flutter' }}
        run: |
          set -euo pipefail
          case "$PROJECT_DIR" in
            ""|/*|*..*) echo "Invalid project folder"; exit 1 ;;
          esac
          test -f "$PROJECT_DIR/pubspec.yaml" || { echo "pubspec.yaml not found"; exit 1; }
          test -f "$PROJECT_DIR/lib/main.dart" || { echo "lib/main.dart not found"; exit 1; }
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Web platform wrapper
        run: |
          set -euo pipefail
          BUILD_DIR="$RUNNER_TEMP/aizora_flutter_web_build"
          APP_NAME="$(basename "$(dirname "$PROJECT_DIR")" | tr '-' '_' | tr -cd '[:alnum:]_')"
          [ -n "$APP_NAME" ] || APP_NAME="aizora_generated_app"
          flutter create --platforms=web --project-name "$APP_NAME" "$BUILD_DIR"
          rm -rf "$BUILD_DIR/test"
          cp -a "$PROJECT_DIR/." "$BUILD_DIR/"
          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"

      - name: Resolve Flutter dependencies
        run: |
          cd "$BUILD_DIR"
          flutter pub get

      - name: Analyze generated Flutter project
        run: |
          cd "$BUILD_DIR"
          flutter analyze --no-pub

      - name: Build generated Web app
        run: |
          cd "$BUILD_DIR"
          flutter build web --release --no-pub

      - name: Upload generated Web build
        uses: actions/upload-artifact@v4
        with:
          name: AIZORA-Generated-Project-Web-${{ github.run_number }}
          path: ${{ env.BUILD_DIR }}/build/web/
          if-no-files-found: error
          retention-days: 14
