name: Flutter code generation smoke test

on:
  push:
    branches: [main]
    paths:
      - 'designer.html'
      - 'tests/flutter_codegen_smoke/**'
      - '.github/workflows/flutter-codegen-smoke.yml'
  pull_request:
    paths:
      - 'designer.html'
      - 'tests/flutter_codegen_smoke/**'
      - '.github/workflows/flutter-codegen-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-generated-flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/flutter_codegen_smoke
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze generated Flutter project
        run: flutter analyze
