name: Flutter code generation smoke test

on:
  push:
    branches: [main]
    paths:
      - 'designer.html'
      - 'tests/flutter_codegen_smoke/**'
      - '.github/workflows/flutter-codegen-smoke.yml'
  pull_request:
    paths:
      - 'designer.html'
      - 'tests/flutter_codegen_smoke/**'
      - '.github/workflows/flutter-codegen-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-generated-flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/flutter_codegen_smoke
    steps:
      - name: Validate Visual Designer JavaScript syntax
        working-directory: ${{ github.workspace }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("designer.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>([\\s\\S]*?)</script>", html)
          if not scripts:
              raise SystemExit("No inline Designer script found")
          Path("/tmp/aizora-designer.js").write_text(scripts[-1], encoding="utf-8")
          PY
          node --check /tmp/aizora-designer.js
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze generated Flutter project
        run: flutter analyze
